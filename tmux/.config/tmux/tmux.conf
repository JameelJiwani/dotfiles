#
# ~/.config/tmux/tmux.conf
#

# ------------------------------------------------------------------------------
# General
# ------------------------------------------------------------------------------

# True color and italics
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

# Don't wait after Escape (keeps vim/nvim snappy)
set -sg escape-time 10
set -g focus-events on

# Mouse for scrolling, selecting and resizing panes
set -g mouse on
set -g history-limit 50000

# Copy to the local clipboard over SSH (OSC 52)
set -g set-clipboard on

# Number windows and panes from 1, and close gaps when one is closed
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Vim keys in copy mode
setw -g mode-keys vi

# ------------------------------------------------------------------------------
# Key bindings (prefix stays C-b)
# ------------------------------------------------------------------------------

# Split and open windows in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes with vim keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded tmux.conf"

# ------------------------------------------------------------------------------
# Status bar
# ------------------------------------------------------------------------------

set -g status-style "bg=default,fg=white"
set -g status-left "#[fg=blue,bold][#S] "
set -g status-left-length 30
set -g status-right "#[fg=brightblack]#h"
setw -g window-status-current-style "fg=green,bold"
